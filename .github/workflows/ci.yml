name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Backend unit tests (warehouse-free subset)
        run: python -m pytest backend/tests -q

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt gdown

      - name: Restore scored warehouse
        id: warehouse-cache
        uses: actions/cache@v4
        with:
          path: data/work
          key: risklens-warehouse-${{ hashFiles('backend/pipeline/**', 'backend/models/**', 'backend/app/**') }}
          restore-keys: risklens-warehouse-

      - name: Download raw dataset
        if: steps.warehouse-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          python -m gdown "https://drive.google.com/uc?id=1ft7ZQdDvWowxqnh_bNvLPfjjf2IEh9ca" -O data/archive.zip
      - name: Extract raw dataset
        if: steps.warehouse-cache.outputs.cache-hit != 'true'
        run: cd data && unzip -o -q archive.zip && rm archive.zip
      - name: Build warehouse, train and score
        if: steps.warehouse-cache.outputs.cache-hit != 'true'
        env:
          RISKLENS_DUCKDB_MEMORY: 2500MB
        run: |
          python -m backend.pipeline.build_warehouse
          python -m backend.models.train
          python -m backend.models.score_all

      - name: Backend tests against the full warehouse
        env:
          RISKLENS_DUCKDB_MEMORY: 2500MB
        run: python -m pytest backend/tests -q

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start API
        env:
          RISKLENS_DUCKDB_MEMORY: 2500MB
        run: |
          nohup uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/status > /dev/null && exit 0; sleep 2; done
          echo "API did not start"; cat api.log; exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000 > /dev/null && exit 0; sleep 2; done
          echo "Frontend did not start"; cat ../web.log; exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        working-directory: frontend
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore
